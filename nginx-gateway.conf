# Sporting Gateway - Nginx Reverse Proxy for VPS + Cloudflare
client_max_body_size 50M;

# 1. Frontend Web App (sportingone.site & www.sportingone.site)
server {
    listen 80;
    server_name sportingone.site www.sportingone.site;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend NestJS API (api.sportingone.site)
server {
    listen 80;
    server_name api.sportingone.site;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # Support WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running queries or file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 3. PhpMyAdmin Database Management (pma.sportingone.site)
server {
    listen 80;
    server_name pma.sportingone.site;

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. Fallback default server for direct IP access
server {
    listen 80 default_server;
    server_name _;
    return 301 http://sportingone.site$request_uri;
}
